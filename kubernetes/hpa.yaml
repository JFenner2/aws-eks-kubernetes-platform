apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: project5-app
  namespace: project5

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: project5-app

  minReplicas: 2
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
