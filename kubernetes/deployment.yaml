apiVersion: apps/v1
kind: Deployment

metadata:
  name: project5-app
  namespace: project5  

spec:
  replicas: 2

  selector:
    matchLabels:
      app: project5-app

  template:
    metadata:
      labels:
        app: project5-app

    spec:
      serviceAccountName: project5-app

      containers:
        - name: project5-app
          image: project5-app:test
          imagePullPolicy: IfNotPresent

          env:
            - name: SECRET_KEY_BASE_DUMMY
              valueFrom:
                secretKeyRef:
                  name: project5-app-secret
                  key: SECRET_KEY_BASE_DUMMY

          envFrom:
            - configMapRef:
                name: project5-app-config

          ports:
            - containerPort: 80

          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /ready
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
