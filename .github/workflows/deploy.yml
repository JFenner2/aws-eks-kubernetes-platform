name: Deploy to EKS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-2
  EKS_CLUSTER_NAME: project5-cluster
  ECR_REPOSITORY: project5-app
  HELM_RELEASE: project5-app
  KUBERNETES_NAMESPACE: project5

jobs:
  test-build-deploy:
    name: Test, Build, Scan and Deploy
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # ------------------------------------------------------------
      # 2. TEST RAILS APPLICATION
      # ------------------------------------------------------------
      - name: Run Rails tests
        run: |
          docker build \
            --platform linux/amd64 \
            -t project5-app:test \
            ./app

          docker run --rm \
            -e SECRET_KEY_BASE_DUMMY=1 \
            project5-app:test \
            bin/rails test

      # ------------------------------------------------------------
      # 3. AUTHENTICATE TO AWS USING GITHUB OIDC
      # ------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::118178009894:role/project5-github-actions
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------------------------------------
      # 4. LOGIN TO AMAZON ECR
      # ------------------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ------------------------------------------------------------
      # 5. BUILD AND PUSH IMMUTABLE IMAGE
      # ------------------------------------------------------------
      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --platform linux/amd64 \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            ./app

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      # ------------------------------------------------------------
      # 6. WAIT FOR ECR VULNERABILITY SCAN
      # ------------------------------------------------------------
      - name: Wait for ECR image scan
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          MAX_ATTEMPTS=12
          ATTEMPT=1

          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "Checking for ECR image scan (attempt $ATTEMPT/$MAX_ATTEMPTS)..."

            SCAN_STATUS=$(aws ecr describe-image-scan-findings \
              --repository-name "$ECR_REPOSITORY" \
              --image-id imageTag="$IMAGE_TAG" \
              --region "$AWS_REGION" \
              --query 'imageScanStatus.status' \
              --output text 2>/dev/null || true)

            if [ "$SCAN_STATUS" = "COMPLETE" ]; then
              echo "ECR image scan completed."
              break
            fi

            if [ "$SCAN_STATUS" = "FAILED" ]; then
              echo "ECR image scan failed."
              exit 1
            fi

            if [ "$ATTEMPT" -eq "$MAX_ATTEMPTS" ]; then
              echo "ECR image scan did not complete within the allowed time."
              exit 1
            fi

            echo "Current scan status: ${SCAN_STATUS:-not available yet}"
            sleep 10
            ATTEMPT=$((ATTEMPT + 1))
          done

      # ------------------------------------------------------------
      # 7. SECURITY GATE
      # ------------------------------------------------------------
      - name: Block images with critical vulnerabilities
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          CRITICAL_FINDINGS=$(aws ecr describe-image-scan-findings \
            --repository-name "$ECR_REPOSITORY" \
            --image-id imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'imageScanFindings.findingSeverityCounts.CRITICAL' \
            --output text)

          if [ "$CRITICAL_FINDINGS" = "None" ]; then
            CRITICAL_FINDINGS=0
          fi

          echo "Critical vulnerabilities found: $CRITICAL_FINDINGS"

          if [ "$CRITICAL_FINDINGS" -gt 0 ]; then
            echo "Deployment blocked: image contains critical vulnerabilities."
            exit 1
          fi

          echo "Security gate passed."

      # ------------------------------------------------------------
      # 8. CONFIGURE ACCESS TO EKS
      # ------------------------------------------------------------
      - name: Configure EKS kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      # ------------------------------------------------------------
      # 9. DEPLOY NEW IMAGE WITH HELM
      # ------------------------------------------------------------
      - name: Deploy to EKS with Helm
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          helm upgrade --install "$HELM_RELEASE" ./helm/project5-app \
            --namespace "$KUBERNETES_NAMESPACE" \
            --set image.repository="$ECR_REGISTRY/$ECR_REPOSITORY" \
            --set image.tag="$IMAGE_TAG" \
            --wait \
            --timeout 5m

      # ------------------------------------------------------------
      # 10. VERIFY THE ROLLOUT
      # ------------------------------------------------------------
      - name: Verify deployment
        run: |
          kubectl rollout status deployment/project5-app \
            --namespace "$KUBERNETES_NAMESPACE" \
            --timeout=180s

          kubectl get pods \
            --namespace "$KUBERNETES_NAMESPACE"
