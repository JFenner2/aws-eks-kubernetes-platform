apiVersion: v1
kind: Service

metadata:
  name: {{ include "project5-app.fullname" . }}
  labels:
    {{- include "project5-app.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}

  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http

  selector:
    {{- include "project5-app.selectorLabels" . | nindent 4 }}
