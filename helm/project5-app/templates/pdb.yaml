{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget

metadata:
  name: {{ include "project5-app.fullname" . }}
  labels:
    {{- include "project5-app.labels" . | nindent 4 }}

spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}

  selector:
    matchLabels:
      {{- include "project5-app.selectorLabels" . | nindent 6 }}
{{- end }}
